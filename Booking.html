```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL 2026 Ticket Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏏 IPL Ticket Booking</h1>
        <p>Book your favourite IPL match tickets!</p>

        <form id="bookingForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                placeholder="Enter your name"
                minlength="3" maxlength="30" required>

            <br><br>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                placeholder="Enter your email" required>

            <br><br>

            <label for="match">Select Match</label>
            <select id="match" name="match" required>
                <option value="">-- Select Match --</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="CSK vs KKR">CSK vs KKR</option>
                <option value="DC vs SRH">DC vs SRH</option>
                <option value="RR vs PBKS">RR vs PBKS</option>
                <option value="SRH vs CSK">SRH vs CSK</option>
                <option value="KKR vs RCB">KKR vs RCB</option>
            </select>

            <br><br>

            <label for="stand">Stand Category</label>
            <select id="stand" name="stand" required>
                <option value="VIP">VIP Stand - ₹2000</option>
                <option value="Premium">Premium Stand - ₹1000</option>
                <option value="Regular">Regular Stand - ₹500</option>
            </select>

            <br><br>

            <label for="tickets">Number of Tickets</label>
            <input type="number" id="tickets" name="tickets"
                min="1" max="10" value="1" required>

            <br><br>

            <label>Additional Preferences</label>

            <br>

            <input type="radio" class="radio"
                name="preference" value="Food Included" required>
            Food Included

            <br>

            <input type="radio" class="radio"
                name="preference" value="No Food">
            No Food

            <br><br>

            <h2>Booking Summary</h2>

            <div id="summary">
                Select your match and tickets.
            </div>

            <br>

            <button type="submit" class="submit">
                Submit Booking
            </button>

            <button type="reset" class="reset">
                Reset
            </button>

        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
```
